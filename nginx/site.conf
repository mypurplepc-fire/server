upstream construction_cost_control {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # --- certbot placeholder -------------------------------------------------
    # Run:  sudo certbot certonly --nginx -d app.example.com
    # certbot will rewrite this file to add the 443 server and redirect 80 -> 443.
    # Until then, everything is served over plain HTTP on port 80.
    # -----------------------------------------------------------------------

    # Request /api/auth/* and the Next.js request headers as-is.
    client_max_body_size 4m;

    location / {
        proxy_pass http://construction_cost_control;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}

