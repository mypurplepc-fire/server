services:
  web:
    build: .
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/construction_erp
      - SECRET_KEY=change-me-in-production
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - .:/app
      - uploads:/app/uploads

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=construction_erp
    volumes:
      - pgdata:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

volumes:
  pgdata:
  uploads:
